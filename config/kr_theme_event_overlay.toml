# 이벤트 리스크 오버레이 설정.
# 설계: docs/superpowers/specs/2026-08-12-event-alpha-design.md §6
#
# default.toml과의 차이는 [strategies.theme_multifactor]의 두 줄뿐이다. 그 두
# 줄이 유일한 차이여야 아래 비교가 오버레이 효과만 재는 것이 된다:
#
#   python -m tradingbot --config config/kr_theme_event_overlay.toml research evaluate
#     --strategy theme_multifactor --market KR
#     --symbols 005930 000660 042700 058470 240810 --start 2023-01-01
#     --benchmark-config config/default.toml
#
# window_days=5, scale=0.5은 처음 정한 값이며 in-sample 스윕으로 고른 것이
# 아니다. 이 저장소는 스윕 승자를 채택했다가 held-out에서 뒤집힌 사례를 이미
# 갖고 있다 (docs/us_etf_rotation_review.md "국면 필터" 절).

[data]
cache_dir = "data/cache"

[backtest]
initial_cash_kr = 10000000
initial_cash_us = 10000

[paper]
state_dir = "state"
poll_interval_seconds = 300

[fees.KR]
commission_rate = 0.00015
sell_tax_rate = 0.0015

[fees.US]
commission_rate = 0.0
sec_fee_rate = 0.0000278
finra_taf_per_share = 0.000166
finra_taf_cap = 8.30

[execution]
slippage_bps = 5

[risk]
# theme_multifactor의 자체 집중도 상한(apply_constraints, max_position_weight=0.40)이
# 이미 0.40을 강제한다. 이 값이 그보다 낮으면 같은 매수가 두 번 거부당한다 — 엔진
# 리스크 캡은 전략 상한 위의 백스톱이어야지, 더 타이트한 거부권이면 안 된다.
max_position_pct = 0.40
max_positions = 5
max_daily_loss_pct = 0.03
stop_loss_pct = 0.05
min_cash_buffer_pct = 0.02

[strategies.ma_cross]
fast = 20
slow = 60
weight = 0.20

[strategies.vol_breakout]
k = 0.5
weight = 0.20
exit = "moc"

[strategies.rsi_reversion]
period = 14
buy_below = 30
exit_above = 55
max_hold_days = 10
weight = 0.20

[strategies.theme_multifactor]
theme = "ai_semiconductor"
market = "KR"
rebalance = "monthly"
top_n = 3
weighting = "inverse_volatility"
volatility_days = 60
bear_exposure = 0.5
# 명시하지 않으면 [factor_weights]의 모든 팩터를 쓰므로, 미국 연구 때문에
# momentum_3m이 추가되면 한국 전략까지 조용히 바뀐다. 3m이 12m_ex1m보다 낫다는
# 증거는 미국 ETF 유니버스에서 측정한 것이고 한국에서는 아직 재지 않았다.
# 근거 없이 옮기지 않기 위해 현재 팩터를 고정한다.
factors = ["momentum_6m", "momentum_12m_ex1m", "foreign_net_20d", "earnings_yield"]
# 이 두 줄이 default.toml과의 유일한 차이다.
event_overlay_window_days = 5
event_overlay_scale = 0.5

[pipeline]
# 일일 배치 수집 대상. 작업 스케줄러가 장 마감 후 하루 1회 실행한다.
processed_dir = "data/processed"
log_dir = "state/pipeline_log"
symbols = ["005930", "000660", "035420", "051910", "005380", "042700", "058470", "240810"]
fundamental_years = 3
retry_attempts = 3
