# 변동성 목표 전략(vol_target) — SOXX 한 종목 전용 설정.
# 수식과 근거: src/tradingbot/strategies/vol_target.py
# 설계 구간 측정과 최종 시험: src/tradingbot/research/exposure_test.py
#
#   python -m tradingbot --config config/vol_target_soxx.toml research vol-target --symbol SOXX
#   python -m tradingbot --config config/vol_target_soxx.toml backtest --market US \
#       --symbols SOXX --strategy vol_target --start 2007-01-01

[data]
cache_dir = "data/cache"

[backtest]
# 주 단위로만 살 수 있어서 자본이 작으면 목표 비중을 맞추지 못한다.
initial_cash_kr = 10000000
initial_cash_us = 100000

[paper]
state_dir = "state"
poll_interval_seconds = 300

[fees.US]
commission_rate = 0.0
sec_fee_rate = 0.0000278
finra_taf_per_share = 0.000166
finra_taf_cap = 8.30

[execution]
slippage_bps = 5

[risk]
# 한 종목 전략이라 종목당 상한은 사실상 전체 상한이다.
max_position_pct = 1.0
max_positions = 1
# 손절과 일일 손실 한도는 꺼 둔다. 이 전략은 변동성이 커지면 스스로 비중을 줄이는
# 것이 위험 관리의 전부다. 평단 -5% 전량 매도 규칙을 겹쳐 두면 측정되는 것은 이
# 전략이 아니라 그 손절 규칙이 되고, 측정 도구도 그 둘을 재현하지 않는다.
max_daily_loss_pct = 1.0
stop_loss_pct = 0.0
min_cash_buffer_pct = 0.02

[strategies.vol_target]
# vol_days, band, max_weight는 결과를 보기 전에 등록한 값이다 (P11). 20일은 한 달치
# 실현 변동성이라는 통상적 기준이며, 성과를 보고 고른 값이 아니다.
#
# target_vol = 0.10은 소유자의 낙폭 한도(-30%)로 정했다 (2026-11-16, P12).
# 5%부터 30%까지 1%p 간격 중, 2007~2024년 최대 낙폭이 -30% 안에 들어온 가장 높은
# 수준이다 (10%: -29.4%, 11%: -32.5%). 이 값은 수익을 만드는 값이 아니라 위험을
# 얼마나 질지 정하는 다이얼이다. 바꾸려면 낙폭 한도를 먼저 정하고 아래로 다시 잰다:
#   python -m tradingbot --config config/vol_target_soxx.toml research vol-target \
#       --calibrate-max-drawdown 0.30
#
# 알아둘 것:
# - 한도는 2008년 하락에 맞춰진 값이고 여유가 없다 (-29.4%). 9%면 -25.0%다.
# - 과거에 지켰다고 앞으로 지킨다는 보장은 아니다. 운용 중 자산이 자체 고점에서
#   30% 넘게 빠지면 이 설정은 실패한 것이므로 중단하고 다시 검토한다.
# - 평균 비중은 44%이고, 2007~2024년 수익은 연 6.3%였다 (그냥 보유는 연 15.2%,
#   낙폭 -66.8%). 같은 한도를 지키는 34% 고정 보유와 장기 성과는 거의 같다.
# - 2025년 이후 누적 +10% 기준(P11)은 20%로 시험해 통과했다. 10%의 같은 구간
#   수치(+30.5%, 낙폭 -10.5%)는 이미 본 구간이라 참고치다.
# 모의투자 후보이며 승격된 것은 아니다.
vol_days = 20
target_vol = 0.10
min_weight = 0.0
max_weight = 0.98
band = 0.10
