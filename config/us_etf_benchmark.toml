# 미국 ETF 동일비중 벤치마크 (설계 §9의 2차 벤치마크).
# 같은 엔진·같은 비용으로 돌리되 선별·국면 조절·절대 모멘텀만 끈다.
# 전략이 이걸 못 이기면 유니버스를 그냥 다 사는 것보다 나을 게 없다.

[data]
cache_dir = "data/cache"

[backtest]
# 1만 달러에서는 ETF 11종 동일비중이 종목당 900달러라 SPY 한 주(수백 달러)
# 반올림 손실이 커진다. 목적이 전략과 벤치마크의 공정한 비교이므로 실제
# 투자금과 같을 필요는 없다.
#
# 주의: 자본을 10배로 올려도 주문 거부율은 17~19%로 거의 그대로였다. 실측 결과
# 거부 사유는 전부 'minimum cash buffer breached'이며 반올림이 아니다. 주문
# 사이징이 [risk_limits] min_cash_weight를 미리 떼어두지 않아 리밸런싱 후반
# 주문이 버퍼를 침범한다. 별도 과제이며 여기서 고치지 않는다.
initial_cash_kr = 10000000
initial_cash_us = 100000

[paper]
state_dir = "state"
poll_interval_seconds = 300

[fees.KR]
commission_rate = 0.00015
sell_tax_rate = 0.0015

[fees.US]
commission_rate = 0.0
sec_fee_rate = 0.0000278
finra_taf_per_share = 0.000166
finra_taf_cap = 8.30

[execution]
slippage_bps = 5

[risk]
# theme_multifactor의 자체 집중도 상한(apply_constraints, max_position_weight=0.40)이
# 이미 0.40을 강제한다. 이 값이 그보다 낮으면 같은 매수가 두 번 거부당한다 — 엔진
# 리스크 캡은 전략 상한 위의 백스톱이어야지, 더 타이트한 거부권이면 안 된다.
max_position_pct = 0.40
# 이 벤치마크는 top_n=11(유니버스 전체)을 동시에 보유한다. default.toml의
# max_positions=5를 그대로 두면 11개 중 5개만 열 수 있어 "동일비중 매수" 자체가
# 설정 충돌로 깨진다 — 한국 판정문이 지적한 것과 같은 함정(risk 캡과 전략 의도가
# 충돌하면 결과가 전략이 아니라 설정의 산물이 된다)이라 유니버스 크기에 맞춘다.
max_positions = 11
max_daily_loss_pct = 0.03
stop_loss_pct = 0.05
min_cash_buffer_pct = 0.02

[strategies.ma_cross]
fast = 20
slow = 60
weight = 0.20

[strategies.vol_breakout]
k = 0.5
weight = 0.20
exit = "moc"

[strategies.rsi_reversion]
period = 14
buy_below = 30
exit_above = 55
max_hold_days = 10
weight = 0.20

[strategies.theme_multifactor]
theme = "us_asset_rotation"
market = "US"
rebalance = "monthly"
top_n = 11
weighting = "equal"
volatility_days = 60
bear_exposure = 1.0
factors = ["momentum_6m", "momentum_12m_ex1m"]
abs_momentum_ma_days = 0
regime_series = "sp500"

[pipeline]
# 일일 배치 수집 대상. 작업 스케줄러가 장 마감 후 하루 1회 실행한다.
processed_dir = "data/processed"
log_dir = "state/pipeline_log"
symbols = ["SPY", "QQQ", "IWM", "EFA", "EEM", "TLT", "IEF", "LQD", "GLD", "DBC", "VNQ"]
fundamental_years = 3
retry_attempts = 3
