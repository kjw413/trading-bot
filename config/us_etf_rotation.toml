# 미국 자산배분 ETF 로테이션 설정.
# 설계: docs/superpowers/specs/2026-07-26-us-market-etf-rotation-design.md
#
# 사용법 (한 줄):
#   python -m tradingbot --config config/us_etf_rotation.toml backtest
#   --strategy theme_multifactor --market US
#   --symbols SPY QQQ IWM EFA EEM TLT IEF LQD GLD DBC VNQ --start 2007-01-01

[data]
cache_dir = "data/cache"

[backtest]
# 1만 달러에서는 ETF 11종 동일비중이 종목당 900달러라 SPY 한 주(수백 달러)
# 반올림 손실이 커진다. 목적이 전략과 벤치마크의 공정한 비교이므로 실제
# 투자금과 같을 필요는 없다.
#
# 이력: 자본을 10배로 올려도 주문 거부율이 17~19%로 그대로였던 것은 반올림이
# 아니라 현금 버퍼 문제였다(전부 'minimum cash buffer breached'). 2026-08-01에
# 주문 사이징이 min_cash_weight를 미리 떼어두도록 고쳤다 — 설계는
# docs/superpowers/specs/2026-08-01-order-sizing-cash-buffer-design.md.
initial_cash_kr = 10000000
initial_cash_us = 100000

[paper]
state_dir = "state"
poll_interval_seconds = 300

[fees.KR]
commission_rate = 0.00015
sell_tax_rate = 0.0015

[fees.US]
commission_rate = 0.0
sec_fee_rate = 0.0000278
finra_taf_per_share = 0.000166
finra_taf_cap = 8.30

[execution]
slippage_bps = 5

[risk]
# theme_multifactor의 자체 집중도 상한(apply_constraints, max_position_weight=0.40)이
# 이미 0.40을 강제한다. 이 값이 그보다 낮으면 같은 매수가 두 번 거부당한다 — 엔진
# 리스크 캡은 전략 상한 위의 백스톱이어야지, 더 타이트한 거부권이면 안 된다.
max_position_pct = 0.40
max_positions = 5
max_daily_loss_pct = 0.03
stop_loss_pct = 0.05
min_cash_buffer_pct = 0.02

[strategies.ma_cross]
fast = 20
slow = 60
weight = 0.20

[strategies.vol_breakout]
k = 0.5
weight = 0.20
exit = "moc"

[strategies.rsi_reversion]
period = 14
buy_below = 30
exit_above = 55
max_hold_days = 10
weight = 0.20

[strategies.theme_multifactor]
theme = "us_asset_rotation"
market = "US"
rebalance = "monthly"
top_n = 3
weighting = "inverse_volatility"
volatility_days = 60
bear_exposure = 0.5
# 미국에는 수급·가치 패널이 없다(수급은 대응 데이터 자체가 없고, ETF에는
# PER/PBR이 없다). 조용히 퇴화하는 대신 사용할 팩터를 명시한다.
#
# 2026-08-01: momentum_12m_ex1m을 momentum_3m으로 교체했다. In-sample(2007~2016)
# 팩터 실측에서 12m_ex1m은 IC 0.028에 분위 스프레드가 **음수**였다 — 신호가 아니라
# 역신호였고, 그것이 전략 가중치의 절반을 차지했다. 3m은 IC 0.124로 넷 중 가장
# 강하다. 손대지 않은 2017~2026 구간에서 교체 효과를 확인했다:
# 초과수익 -3.80 -> -2.93%p, walk-forward 승률 0.43 -> 0.57, Sharpe 0.52 -> 0.63.
# 여전히 승격 기준에는 미달이다(docs/us_etf_rotation_review.md).
factors = ["momentum_3m", "momentum_6m"]
# 채권·금·원자재가 섞인 유니버스에서는 자산별 하락 추세 배제가 필수다.
abs_momentum_ma_days = 200
regime_series = "sp500"
# research.toml [universe] safe_asset = "IEF"가 선언해 둔 값. 국면 필터가
# 위험자산에서 빼낸 비중이 0% 현금으로 노는 대신 중기국채로 간다. IEF도 자기
# 200일선 위에 있을 때만 쓴다 — 2022년처럼 주식과 채권이 함께 빠지면 채권도
# 피난처가 아니므로 그때는 현금으로 돌아간다.
#
# 이 항목의 효과만 따로 재려면:
#   research sweep --param safe_asset=IEF,none
safe_asset = "IEF"

[pipeline]
# 일일 배치 수집 대상. 작업 스케줄러가 장 마감 후 하루 1회 실행한다.
processed_dir = "data/processed"
log_dir = "state/pipeline_log"
symbols = ["SPY", "QQQ", "IWM", "EFA", "EEM", "TLT", "IEF", "LQD", "GLD", "DBC", "VNQ"]
fundamental_years = 3
retry_attempts = 3
