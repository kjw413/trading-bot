[themes.us_asset_rotation]
name = "미국 자산배분 ETF 로테이션"
market = "US"
# from은 2026-07-28 실측(data/cache/US/*.parquet, --start 2007-01-01 수집)
# 기준 각 ETF의 실제 최초 캐시 거래일이다. 11종 모두 2007-01-03으로 동일한데,
# 이는 각 ETF가 2007-01-01 이전에 이미 상장돼 있었고 2007-01-03이 그 해의
# 첫 거래일(1/1 신정, 1/2 제럴드 포드 국가 애도일 휴장)이기 때문이다 — 상장일
# 자체가 그 날짜인 것은 아니다.
members = [
    { symbol = "SPY", from = "2007-01-03" },  # 미국 대형주
    { symbol = "QQQ", from = "2007-01-03" },  # 미국 기술주
    { symbol = "IWM", from = "2007-01-03" },  # 미국 소형주
    { symbol = "EFA", from = "2007-01-03" },  # 선진국 주식
    { symbol = "EEM", from = "2007-01-03" },  # 신흥국 주식
    { symbol = "TLT", from = "2007-01-03" },  # 미국 장기국채
    { symbol = "IEF", from = "2007-01-03" },  # 미국 중기국채
    { symbol = "LQD", from = "2007-01-03" },  # 투자등급 회사채
    { symbol = "GLD", from = "2007-01-03" },  # 금
    { symbol = "DBC", from = "2007-01-03" },  # 원자재
    { symbol = "VNQ", from = "2007-01-03" },  # 미국 리츠
]
